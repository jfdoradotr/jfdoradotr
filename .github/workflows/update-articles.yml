name: Update latest articles

on:
  schedule:
    # Daily, after the site's midnight (Mexico City) rebuild publishes scheduled posts.
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rewrite the articles list from the RSS feed
        run: python3 .github/scripts/update_articles.py

      - name: Commit if the list changed
        run: |
          if git diff --quiet README.md; then
            echo "No new articles."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update latest articles from the RSS feed"
          git push
